<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - ProjectMate</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- Navigation Bar -->

    <nav>

        <h2>ProjectMate</h2>

        <div>

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('student_login') }}">
                Student Login
            </a>

            <a href="{{ url_for('faculty_login') }}">
                Faculty Login
            </a>

            <a href="{{ url_for('admin_login') }}">
                Admin Login
            </a>

        </div>

    </nav>


    <!-- Admin Login Section -->

    <main>

        <section class="card">

            <h1>
                Admin Login
            </h1>

            <p>
                Login to access the ProjectMate administration panel.
            </p>


            <!-- Login Form -->

            <form method="POST">

                <label>
                    Email:
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >


                <label>
                    Password:
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <!-- Back to Home -->

            <p>

                <a href="{{ url_for('home') }}">
                    Back to Home
                </a>

            </p>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 ProjectMate |
            Smart Project Team Formation &
            Collaboration System
        </p>

    </footer>

</body>

</html>
