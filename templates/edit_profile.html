<!DOCTYPE html>
<html>

<head>

    <title>Edit Profile - ProjectMate</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav>

        <h2>ProjectMate</h2>

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('student_dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('student_profile') }}">
            Profile
        </a>

        <a href="{{ url_for('student_skills') }}">
            Skills
        </a>

        <a href="{{ url_for('find_team') }}">
            Find Team
        </a>

        <a href="{{ url_for('my_team') }}">
            My Team
        </a>

        <a href="{{ url_for('my_projects') }}">
            Projects
        </a>

        <a href="{{ url_for('student_logout') }}">
            Logout
        </a>

    </nav>

    <hr>

    <h1>Edit My Profile</h1>

    <form method="POST">

        <label>
            Register Number:
        </label>

        <br>

        <input
            type="text"
            name="register_number"
            value="{{ profile['register_number'] or '' }}"
            required
        >

        <br><br>

        <label>
            Department:
        </label>

        <br>

        <input
            type="text"
            name="department"
            value="{{ profile['department'] or '' }}"
            required
        >

        <br><br>

        <label>
            Year:
        </label>

        <br>

        <input
            type="text"
            name="year"
            value="{{ profile['year'] or '' }}"
            required
        >

        <br><br>

        <label>
            Phone:
        </label>

        <br>

        <input
            type="text"
            name="phone"
            value="{{ profile['phone'] or '' }}"
            required
        >

        <br><br>

        <label>
            Bio:
        </label>

        <br>

        <textarea
            name="bio"
            rows="5"
            cols="40"
        >{{ profile['bio'] or '' }}</textarea>

        <br><br>

        <button type="submit">
            Save Profile
        </button>

    </form>

    <br>

    <a href="{{ url_for('student_profile') }}">
        Back to Profile
    </a>

</body>

</html>
