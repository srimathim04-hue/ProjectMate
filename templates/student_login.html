<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login - ProjectMate</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- Navigation Bar -->

    <nav>

        <h2>ProjectMate</h2>

        <div>

            <a href="/">
                Home
            </a>

            <a href="/student-login">
                Student Login
            </a>

            <a href="/faculty-login">
                Faculty Login
            </a>

            <a href="/admin-login">
                Admin Login
            </a>

        </div>

    </nav>


    <!-- Login Section -->

    <main>

        <section class="card">

            <h1>
                Student Login
            </h1>

            <p>
                Login to access your ProjectMate student dashboard.
            </p>


            <!-- Login Form -->

            <form method="POST">

                <label>
                    Email:
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Password:
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <!-- Registration Link -->

            <p>

                Don't have an account?

                <a href="/student-register">
                    Register Here
                </a>

            </p>


            <p>

                <a href="/">
                    Back to Home
                </a>

            </p>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 ProjectMate |
            Smart Project Team Formation &
            Collaboration System
        </p>

    </footer>

</body>

</html>
