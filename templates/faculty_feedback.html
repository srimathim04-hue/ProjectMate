<!DOCTYPE html>
<html>

<head>

    <title>Give Feedback - ProjectMate</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>Faculty Feedback</h1>

    <p>
        Welcome, {{ faculty["name"] }}!
    </p>

    <hr>

    <form method="POST">

        <label>
            Select Project:
        </label>

        <br><br>

        <select name="project_id" required>

            <option value="">
                Select Project
            </option>

            {% for project in projects %}

                <option value="{{ project['id'] }}">
                    {{ project['project_name'] }}
                </option>

            {% endfor %}

        </select>

        <br><br>


        <label>
            Feedback:
        </label>

        <br><br>

        <textarea
            name="feedback_text"
            rows="5"
            cols="50"
            placeholder="Enter your feedback..."
            required
        ></textarea>

        <br><br>


        <label>
            Rating:
        </label>

        <br><br>

        <select name="rating" required>

            <option value="">
                Select Rating
            </option>

            <option value="1">
                1 - Poor
            </option>

            <option value="2">
                2 - Needs Improvement
            </option>

            <option value="3">
                3 - Average
            </option>

            <option value="4">
                4 - Good
            </option>

            <option value="5">
                5 - Excellent
            </option>

        </select>

        <br><br>

        <button type="submit">
            Submit Feedback
        </button>

    </form>

    <br>

    <a href="{{ url_for('faculty_dashboard') }}">
        Back to Faculty Dashboard
    </a>

</body>

</html>
